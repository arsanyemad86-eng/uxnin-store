<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages SPA fallback — preserve hash route on deep links
      var path = location.pathname.replace(/^\/uxnin-store\//, "");
      var hash = location.hash || "";
      location.replace("/uxnin-store/" + (path ? "#/" + path : "") + hash);
    </script>
  </head>
  <body>Redirecting to <a href="/uxnin-store/">UXNIN store…</a></body>
</html>
